# Zetacoin Core CI — runs on PRs and pushes
# Lightweight: Linux build + validated unit tests only

name: CI
on:
  pull_request:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'

concurrency:
  group: ${{ github.event_name != 'pull_request' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 'Build and test (Linux)'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkgconf libevent-dev libboost-dev libsqlite3-dev libzmq3-dev

      - name: Configure
        run: cmake -B build -DBUILD_GUI=OFF -DBUILD_TESTS=ON -DBUILD_BENCH=OFF -DENABLE_IPC=OFF

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run unit tests
        run: build/bin/test_zetacoin --log_level=test_suite --catch_system_error=no -- DEBUG_LOG_OUT

      - name: Run functional tests
        run: python3 test/functional/test_runner.py --ci --timeout-factor=2 --jobs=$(nproc) wallet_basic.py wallet_send.py feature_bech32.py rpc_rawtransaction.py wallet_bumpfee.py wallet_labels.py wallet_listsinceblock.py mining_basic.py
        timeout-minutes: 30
