# Zetacoin Core Release — runs only on version tags
# Builds distributable archives for Linux, macOS, and Windows
# Creates a GitHub Release with the archives attached

name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  VERSION: ${{ github.ref_name }}

jobs:
  linux:
    name: 'Linux x86_64'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkgconf libevent-dev libboost-dev libsqlite3-dev libzmq3-dev

      - name: Configure
        run: cmake -B build -DBUILD_GUI=OFF -DBUILD_TESTS=OFF -DBUILD_BENCH=OFF -DENABLE_IPC=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Strip binaries
        run: strip build/bin/zetacoin build/bin/zetacoind build/bin/zetacoin-cli build/bin/zetacoin-tx build/bin/zetacoin-wallet build/bin/zetacoin-util

      - name: Package
        run: |
          DIST=zetacoin-${VERSION#v}-linux-x86_64
          mkdir -p ${DIST}/bin
          cp build/bin/zetacoin build/bin/zetacoind build/bin/zetacoin-cli \
             build/bin/zetacoin-tx build/bin/zetacoin-wallet build/bin/zetacoin-util \
             ${DIST}/bin/
          cp COPYING README.md ${DIST}/
          tar czf ${DIST}.tar.gz ${DIST}
          sha256sum ${DIST}.tar.gz > ${DIST}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: zetacoin-*-linux-x86_64.tar.gz*

  macos:
    name: 'macOS ARM64'
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        env:
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: brew install --quiet cmake boost libevent pkgconf sqlite zmq

      - name: Configure
        run: cmake -B build -DBUILD_GUI=OFF -DBUILD_TESTS=OFF -DBUILD_BENCH=OFF -DENABLE_IPC=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Package
        run: |
          DIST=zetacoin-${VERSION#v}-macos-arm64
          mkdir -p ${DIST}/bin
          cp build/bin/zetacoin build/bin/zetacoind build/bin/zetacoin-cli \
             build/bin/zetacoin-tx build/bin/zetacoin-wallet build/bin/zetacoin-util \
             ${DIST}/bin/
          cp COPYING README.md ${DIST}/
          tar czf ${DIST}.tar.gz ${DIST}
          shasum -a 256 ${DIST}.tar.gz > ${DIST}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: zetacoin-*-macos-arm64.tar.gz*

  windows:
    name: 'Windows x86_64'
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - name: Configure Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure vcpkg
        run: |
          echo "set(VCPKG_BUILD_TYPE release)" >> "${VCPKG_INSTALLATION_ROOT}/triplets/x64-windows.cmake"
          sed -i '1s/^/set(ENV{CMAKE_POLICY_VERSION_MINIMUM} 3.5)\n/' "${VCPKG_INSTALLATION_ROOT}/scripts/ports.cmake"

      - name: Restore vcpkg cache
        uses: actions/cache/restore@v4
        id: vcpkg-cache
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: release-vcpkg-${{ hashFiles('vcpkg.json') }}

      - name: Configure
        run: |
          cmake -B build --preset vs2022 `
            -DCMAKE_TOOLCHAIN_FILE="${env:VCPKG_INSTALLATION_ROOT}/scripts/buildsystems/vcpkg.cmake" `
            -DBUILD_GUI=OFF `
            -DBUILD_TESTS=OFF `
            -DBUILD_BENCH=OFF `
            -DENABLE_IPC=OFF

      - name: Save vcpkg cache
        uses: actions/cache/save@v4
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: release-vcpkg-${{ hashFiles('vcpkg.json') }}

      - name: Build
        working-directory: build
        run: cmake --build . -j $env:NUMBER_OF_PROCESSORS --config Release

      - name: Package
        shell: pwsh
        run: |
          $ver = "${{ env.VERSION }}".TrimStart("v")
          $dist = "zetacoin-${ver}-windows-x86_64"
          New-Item -ItemType Directory -Path "${dist}/bin" -Force
          Copy-Item build/bin/Release/zetacoin.exe,
                    build/bin/Release/zetacoind.exe,
                    build/bin/Release/zetacoin-cli.exe,
                    build/bin/Release/zetacoin-tx.exe,
                    build/bin/Release/zetacoin-wallet.exe,
                    build/bin/Release/zetacoin-util.exe `
                    -Destination "${dist}/bin/"
          Copy-Item COPYING, README.md -Destination "${dist}/"
          Compress-Archive -Path ${dist} -DestinationPath "${dist}.zip"
          (Get-FileHash "${dist}.zip" -Algorithm SHA256).Hash.ToLower() + "  ${dist}.zip" | Out-File "${dist}.zip.sha256" -Encoding ascii

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: zetacoin-*-windows-x86_64.zip*

  release:
    name: 'Create GitHub Release'
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Zetacoin Core ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/*
