# Zetacoin Core Release — runs only on version tags
# Builds distributable archives for Linux, macOS, and Windows
# Creates a GitHub Release with the archives attached
#
# Approach: use cmake --install with --strip to collect all binaries,
# avoiding manual binary name lists. Bitcoin Core uses this pattern
# via GOAL="install" in their CI scripts.

name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  VERSION: ${{ github.ref_name }}

jobs:
  linux:
    name: 'Linux x86_64'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkgconf libevent-dev libboost-dev libsqlite3-dev libzmq3-dev qt6-base-dev qt6-tools-dev qt6-l10n-tools libqrencode-dev libgl-dev

      - name: Configure
        run: cmake -B build -DBUILD_GUI=ON -DBUILD_TESTS=OFF -DBUILD_BENCH=OFF -DENABLE_IPC=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Install
        run: cmake --install build --prefix install --strip

      - name: Package
        run: |
          DIST=zetacoin-${VERSION#v}-linux-x86_64
          mv install ${DIST}
          cp COPYING README.md ${DIST}/
          tar czf ${DIST}.tar.gz ${DIST}
          sha256sum ${DIST}.tar.gz > ${DIST}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: zetacoin-*-linux-x86_64.tar.gz*

  macos:
    name: 'macOS ARM64'
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        env:
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: brew install --quiet cmake boost libevent pkgconf sqlite zmq qt@6 qrencode

      - name: Configure
        run: cmake -B build -DBUILD_GUI=ON -DBUILD_TESTS=OFF -DBUILD_BENCH=OFF -DENABLE_IPC=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Install
        run: cmake --install build --prefix install --strip

      - name: Package
        run: |
          DIST=zetacoin-${VERSION#v}-macos-arm64
          mv install ${DIST}
          cp COPYING README.md ${DIST}/
          tar czf ${DIST}.tar.gz ${DIST}
          shasum -a 256 ${DIST}.tar.gz > ${DIST}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: zetacoin-*-macos-arm64.tar.gz*

  windows:
    name: 'Windows x86_64'
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5

      - name: Configure Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure vcpkg
        shell: bash
        run: |
          echo "set(VCPKG_BUILD_TYPE release)" >> "${VCPKG_INSTALLATION_ROOT}/triplets/x64-windows.cmake"
          sed -i '1s/^/set(ENV{CMAKE_POLICY_VERSION_MINIMUM} 3.5)\n/' "${VCPKG_INSTALLATION_ROOT}/scripts/ports.cmake"

      - name: Restore vcpkg cache
        uses: actions/cache/restore@v4
        id: vcpkg-cache
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: release-gui-vcpkg-${{ hashFiles('vcpkg.json') }}

      - name: Configure
        run: |
          cmake -B build --preset vs2022 `
            -DCMAKE_TOOLCHAIN_FILE="${env:VCPKG_INSTALLATION_ROOT}/scripts/buildsystems/vcpkg.cmake" `
            -DBUILD_GUI=ON `
            -DBUILD_TESTS=OFF `
            -DBUILD_BENCH=OFF `
            -DENABLE_IPC=OFF

      - name: Save vcpkg cache
        uses: actions/cache/save@v4
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: release-gui-vcpkg-${{ hashFiles('vcpkg.json') }}

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build
        working-directory: build
        run: cmake --build . -j $env:NUMBER_OF_PROCESSORS --config Release

      - name: Install
        run: cmake --install build --prefix install --config Release --strip

      - name: Bundle DLLs
        shell: pwsh
        run: |
          # Find vcpkg installed dir
          $vcpkgDirs = @(
            "build/vcpkg_installed/x64-windows",
            "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows"
          )
          $vcpkgDir = $vcpkgDirs | Where-Object { Test-Path "$_/bin" } | Select-Object -First 1
          if (-not $vcpkgDir) {
            $vcpkgDir = Get-ChildItem -Path build -Filter "x64-windows" -Directory -Recurse -ErrorAction SilentlyContinue | Where-Object { Test-Path "$($_.FullName)/bin" } | Select-Object -First 1
            if ($vcpkgDir) { $vcpkgDir = $vcpkgDir.FullName }
          }
          Write-Host "vcpkg dir: $vcpkgDir"
          # Copy vcpkg runtime DLLs
          if ($vcpkgDir -and (Test-Path "$vcpkgDir/bin")) {
            Get-ChildItem "$vcpkgDir/bin/*.dll" | ForEach-Object {
              if (-not (Test-Path "install/bin/$($_.Name)")) {
                Copy-Item $_.FullName -Destination install/bin/
              }
            }
          }
          # Copy Qt platform + styles plugins
          if ($vcpkgDir) {
            $qwindows = Get-ChildItem -Path $vcpkgDir -Filter "qwindows.dll" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($qwindows) {
              New-Item -ItemType Directory -Path "install/bin/platforms" -Force | Out-Null
              Copy-Item $qwindows.FullName -Destination "install/bin/platforms/"
            }
            $qstyles = Get-ChildItem -Path $vcpkgDir -Filter "qwindowsvistastyle.dll" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($qstyles) {
              New-Item -ItemType Directory -Path "install/bin/styles" -Force | Out-Null
              Copy-Item $qstyles.FullName -Destination "install/bin/styles/"
            }
          }

      - name: Build NSIS installer (CPack)
        working-directory: build
        run: cpack -G NSIS -C Release --verbose
        continue-on-error: true

      - name: Package zip
        shell: pwsh
        run: |
          $ver = "${{ env.VERSION }}".TrimStart("v")
          $dist = "zetacoin-${ver}-windows-x86_64"
          Rename-Item install ${dist}
          Copy-Item COPYING, README.md -Destination "${dist}/"
          Compress-Archive -Path ${dist} -DestinationPath "${dist}.zip"
          (Get-FileHash "${dist}.zip" -Algorithm SHA256).Hash.ToLower() + "  ${dist}.zip" | Out-File "${dist}.zip.sha256" -Encoding ascii

      - name: Package installer
        shell: pwsh
        run: |
          $ver = "${{ env.VERSION }}".TrimStart("v")
          $installer = Get-ChildItem build -Filter "Zetacoin*.exe" | Select-Object -First 1
          if ($installer) {
            Move-Item $installer.FullName "zetacoin-${ver}-win64-setup.exe"
            (Get-FileHash "zetacoin-${ver}-win64-setup.exe" -Algorithm SHA256).Hash.ToLower() + "  zetacoin-${ver}-win64-setup.exe" | Out-File "zetacoin-${ver}-win64-setup.exe.sha256" -Encoding ascii
          }

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64-zip
          path: zetacoin-*-windows-x86_64.zip*

      - name: Upload installer
        uses: actions/upload-artifact@v4
        if: hashFiles('zetacoin-*-win64-setup.exe') != ''
        continue-on-error: true
        with:
          name: windows-x86_64-setup
          path: zetacoin-*-win64-setup.exe*

  release:
    name: 'Create GitHub Release'
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Zetacoin Core ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/*
