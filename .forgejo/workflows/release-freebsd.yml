# Zetacoin Core FreeBSD Release — runs on Pacyworld Forgejo runner
# Produces a single statically-linked binary tarball built on FreeBSD 13.5
# for maximum compatibility (runs on 13.5+, 14.x, 15.x).
#
# The runner (runner01.pacyworld.com) runs FreeBSD 15.0 in host mode.
# We use a FreeBSD 13.5 jail for the actual build to get the oldest
# OSREL ELF note, ensuring forward compatibility with all supported versions.
#
# Prerequisites on the runner host:
#   - Jail "zetacoin-build-135" with FreeBSD 13.5-RELEASE base
#   - Jail must have: git, cmake, pkgconf, gmake, bash, curl installed
#   - Runner user (act_runner) must have doas access to jexec

name: FreeBSD Release
on:
  push:
    tags:
      - 'v*'

jobs:
  freebsd:
    name: 'FreeBSD amd64 (static, 13.5 jail)'
    runs-on: FreeBSD:host

    steps:
      - name: Checkout source
        run: |
          # actions/checkout requires Node.js — use raw git clone on bare FreeBSD
          rm -rf zetacoin
          git clone --depth 1 --branch ${{ gitea.ref_name }} ${{ gitea.server_url }}/${{ gitea.repository }}.git zetacoin

      - name: Prepare jail workspace
        run: |
          JAIL=zetacoin-build-135
          JAILROOT=$(doas jls -j ${JAIL} path 2>/dev/null || echo "/usr/local/jails/${JAIL}")
          BUILDDIR="${JAILROOT}/tmp/zetacoin-build"

          # Clean previous build
          doas rm -rf "${BUILDDIR}"
          doas mkdir -p "${BUILDDIR}"

          # Copy source into jail
          doas cp -R zetacoin/ "${BUILDDIR}/src"
          doas chown -R root:wheel "${BUILDDIR}"

      - name: Build dependencies (static)
        run: |
          JAIL=zetacoin-build-135
          doas jexec ${JAIL} sh -c '
            cd /tmp/zetacoin-build/src/depends
            gmake -j$(sysctl -n hw.ncpu) NO_QT=1 NO_QR=1 NO_IPC=1
          '

      - name: Configure
        run: |
          JAIL=zetacoin-build-135
          doas jexec ${JAIL} sh -c '
            cd /tmp/zetacoin-build
            cmake -S src -B build \
              -DCMAKE_TOOLCHAIN_FILE=/tmp/zetacoin-build/src/depends/x86_64-unknown-freebsd13/toolchain.cmake \
              -DBUILD_DAEMON=ON \
              -DBUILD_CLI=ON \
              -DBUILD_GUI=OFF \
              -DBUILD_TX=OFF \
              -DBUILD_UTIL=OFF \
              -DBUILD_WALLET_TOOL=OFF \
              -DBUILD_TESTS=OFF \
              -DBUILD_BENCH=OFF \
              -DBUILD_SHARED_LIBS=OFF \
              -DENABLE_IPC=OFF \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_EXE_LINKER_FLAGS="-static"
          '

      - name: Build
        run: |
          JAIL=zetacoin-build-135
          doas jexec ${JAIL} sh -c '
            cd /tmp/zetacoin-build
            cmake --build build -j$(sysctl -n hw.ncpu)
          '

      - name: Verify static linkage
        run: |
          JAIL=zetacoin-build-135
          JAILROOT=$(doas jls -j ${JAIL} path)
          echo "=== File type ==="
          file "${JAILROOT}/tmp/zetacoin-build/build/bin/zetacoind"
          echo "=== Dynamic dependencies ==="
          ldd "${JAILROOT}/tmp/zetacoin-build/build/bin/zetacoind" 2>&1 || echo "(none — statically linked)"

      - name: Package
        run: |
          JAIL=zetacoin-build-135
          JAILROOT=$(doas jls -j ${JAIL} path)
          VERSION=${{ gitea.ref_name }}
          DIST="zetacoin-${VERSION#v}-freebsd-amd64-static"

          mkdir -p "${DIST}"
          for bin in zetacoind zetacoin-cli; do
            cp "${JAILROOT}/tmp/zetacoin-build/build/bin/${bin}" "${DIST}/"
            strip "${DIST}/${bin}"
          done
          cp zetacoin/COPYING zetacoin/README.md "${DIST}/"

          tar czf "${DIST}.tar.gz" "${DIST}"
          sha256 "${DIST}.tar.gz" > "${DIST}.tar.gz.sha256"

          echo "=== Package contents ==="
          tar tzf "${DIST}.tar.gz"
          echo "=== SHA256 ==="
          cat "${DIST}.tar.gz.sha256"

      - name: Clean up jail workspace
        if: always()
        run: |
          JAIL=zetacoin-build-135
          JAILROOT=$(doas jls -j ${JAIL} path 2>/dev/null || echo "/usr/local/jails/${JAIL}")
          doas rm -rf "${JAILROOT}/tmp/zetacoin-build"
