# Zetacoin Core FreeBSD Release — runs on Pacyworld Forgejo runner
# Produces a single statically-linked binary tarball built on FreeBSD 13.5
# for maximum compatibility (runs on 13.5+, 14.x, 15.x).
#
# The runner (runner01.pacyworld.com) runs FreeBSD 15.0 in host mode.
# An ephemeral FreeBSD 13.5 jail is provisioned via the freebsd-build-action
# to get the oldest OSREL ELF note, ensuring forward compatibility.

name: FreeBSD Release
on:
  push:
    tags:
      - 'v*'

env:
  FREEBSD_VERSION: '13.5'
  JAIL_NAME: 'zetacoin-build-135'

jobs:
  freebsd:
    name: 'FreeBSD amd64 (static, 13.5 jail)'
    runs-on: FreeBSD

    steps:
      - name: Checkout source
        run: |
          rm -rf zetacoin
          git clone --depth 1 --branch ${{ github.ref_name }} ${{ github.server_url }}/${{ github.repository }}.git zetacoin

      - name: Provision FreeBSD 13.5 build jail
        id: jail
        uses: https://pacyworld.dev/pacyworld/freebsd-build-action@master
        with:
          version: ${{ env.FREEBSD_VERSION }}
          jail_name: ${{ env.JAIL_NAME }}
          packages: 'git cmake pkgconf gmake bash curl'
          zfs_parent: 'Storage/jails'

      - name: Prepare jail workspace
        run: |
          JAILPATH="${{ steps.jail.outputs.jail_path }}"
          BUILDDIR="${JAILPATH}/tmp/zetacoin-build"
          doas rm -rf "${BUILDDIR}"
          doas mkdir -p "${BUILDDIR}"
          doas cp -R zetacoin/ "${BUILDDIR}/src"
          doas chown -R root:wheel "${BUILDDIR}"

      - name: Build dependencies (static)
        run: |
          doas jexec ${{ env.JAIL_NAME }} sh -c '
            cd /tmp/zetacoin-build/src/depends
            gmake -j$(sysctl -n hw.ncpu) NO_QT=1 NO_QR=1 NO_IPC=1
          '

      - name: Configure
        run: |
          doas jexec ${{ env.JAIL_NAME }} sh -c '
            cd /tmp/zetacoin-build
            # Detect the depends toolchain path
            TOOLCHAIN=$(ls -d /tmp/zetacoin-build/src/depends/x86_64-unknown-freebsd*/toolchain.cmake 2>/dev/null | head -1)
            cmake -S src -B build \
              -DCMAKE_TOOLCHAIN_FILE="${TOOLCHAIN}" \
              -DBUILD_DAEMON=ON \
              -DBUILD_CLI=ON \
              -DBUILD_GUI=OFF \
              -DBUILD_TX=OFF \
              -DBUILD_UTIL=OFF \
              -DBUILD_WALLET_TOOL=OFF \
              -DBUILD_TESTS=OFF \
              -DBUILD_BENCH=OFF \
              -DBUILD_SHARED_LIBS=OFF \
              -DENABLE_IPC=OFF \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_EXE_LINKER_FLAGS="-static"
          '

      - name: Build
        run: |
          doas jexec ${{ env.JAIL_NAME }} sh -c '
            cd /tmp/zetacoin-build
            cmake --build build -j$(sysctl -n hw.ncpu)
          '

      - name: Verify static linkage
        run: |
          JAILPATH="${{ steps.jail.outputs.jail_path }}"
          echo "=== File type ==="
          file "${JAILPATH}/tmp/zetacoin-build/build/bin/zetacoind"
          echo "=== Dynamic dependencies ==="
          ldd "${JAILPATH}/tmp/zetacoin-build/build/bin/zetacoind" 2>&1 || echo "(none — statically linked)"

      - name: Package
        run: |
          JAILPATH="${{ steps.jail.outputs.jail_path }}"
          VERSION=${{ github.ref_name }}
          DIST="zetacoin-${VERSION#v}-freebsd-amd64-static"

          mkdir -p "${DIST}"
          for bin in zetacoind zetacoin-cli; do
            cp "${JAILPATH}/tmp/zetacoin-build/build/bin/${bin}" "${DIST}/"
            strip "${DIST}/${bin}"
          done
          cp zetacoin/COPYING zetacoin/README.md "${DIST}/"

          tar czf "${DIST}.tar.gz" "${DIST}"
          sha256 "${DIST}.tar.gz" > "${DIST}.tar.gz.sha256"

          echo "=== Package contents ==="
          tar tzf "${DIST}.tar.gz"
          echo "=== SHA256 ==="
          cat "${DIST}.tar.gz.sha256"

          # Export for upload steps
          echo "DIST_TARBALL=${DIST}.tar.gz" >> "$GITHUB_ENV"
          echo "DIST_SHA256=${DIST}.tar.gz.sha256" >> "$GITHUB_ENV"

      - name: Upload to Forgejo release
        run: |
          TAG="${{ github.ref_name }}"
          API="${{ github.server_url }}/api/v1"
          TOKEN="${{ secrets.FORGEJO_TOKEN }}"
          REPO="${{ github.repository }}"

          # Get or create release for this tag
          RELEASE_ID=$(curl -s -H "Authorization: token ${TOKEN}" \
            "${API}/repos/${REPO}/releases/tags/${TAG}" | \
            python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null)

          if [ -z "${RELEASE_ID}" ] || [ "${RELEASE_ID}" = "None" ]; then
            echo "==> Creating Forgejo release for ${TAG}..."
            RELEASE_ID=$(curl -s -X POST -H "Authorization: token ${TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"${TAG}\",\"name\":\"Zetacoin Core ${TAG}\",\"draft\":false,\"prerelease\":true}" \
              "${API}/repos/${REPO}/releases" | \
              python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
          fi

          echo "==> Uploading ${DIST_TARBALL} to Forgejo release ${RELEASE_ID}..."
          curl -s -X POST -H "Authorization: token ${TOKEN}" \
            -F "attachment=@${DIST_TARBALL}" \
            "${API}/repos/${REPO}/releases/${RELEASE_ID}/assets?name=${DIST_TARBALL}"
          curl -s -X POST -H "Authorization: token ${TOKEN}" \
            -F "attachment=@${DIST_SHA256}" \
            "${API}/repos/${REPO}/releases/${RELEASE_ID}/assets?name=${DIST_SHA256}"
          echo "==> Forgejo upload complete."

      - name: Upload to GitHub release
        if: ${{ secrets.GITHUB_UPLOAD_TOKEN != '' }}
        run: |
          TAG="${{ github.ref_name }}"
          GH_API="https://api.github.com"
          GH_TOKEN="${{ secrets.GITHUB_UPLOAD_TOKEN }}"
          GH_REPO="tuaris/zetacoin"

          # Get or create release
          RELEASE_ID=$(curl -s -H "Authorization: token ${GH_TOKEN}" \
            "${GH_API}/repos/${GH_REPO}/releases/tags/${TAG}" | \
            python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null)

          if [ -z "${RELEASE_ID}" ] || [ "${RELEASE_ID}" = "None" ]; then
            echo "==> Creating GitHub release for ${TAG}..."
            RELEASE_ID=$(curl -s -X POST -H "Authorization: token ${GH_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"${TAG}\",\"name\":\"Zetacoin Core ${TAG}\",\"draft\":false,\"prerelease\":true}" \
              "${GH_API}/repos/${GH_REPO}/releases" | \
              python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
          fi

          UPLOAD_URL="https://uploads.github.com/repos/${GH_REPO}/releases/${RELEASE_ID}/assets"
          echo "==> Uploading ${DIST_TARBALL} to GitHub release ${RELEASE_ID}..."
          curl -s -X POST -H "Authorization: token ${GH_TOKEN}" \
            -H "Content-Type: application/gzip" \
            --data-binary "@${DIST_TARBALL}" \
            "${UPLOAD_URL}?name=${DIST_TARBALL}"
          curl -s -X POST -H "Authorization: token ${GH_TOKEN}" \
            -H "Content-Type: text/plain" \
            --data-binary "@${DIST_SHA256}" \
            "${UPLOAD_URL}?name=${DIST_SHA256}"
          echo "==> GitHub upload complete."

      - name: Tear down jail
        if: always()
        uses: https://pacyworld.dev/pacyworld/freebsd-build-action/teardown@master
        with:
          jail_name: ${{ env.JAIL_NAME }}
          zfs_parent: 'Storage/jails'
